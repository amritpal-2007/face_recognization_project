<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#2563eb,#4f46e5);
}

.login-box{

    width:380px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(15px);

    border-radius:20px;

    padding:40px;

    box-shadow:0 10px 30px rgba(0,0,0,.3);

    color:white;

    text-align:center;

}

.login-box h1{

    margin-bottom:10px;
    font-size:30px;

}

.login-box p{

    margin-bottom:30px;
    color:#e5e7eb;

}

.input-box{

    width:100%;
    margin-bottom:20px;

}

.input-box input{

    width:100%;

    padding:14px;

    border:none;

    outline:none;

    border-radius:10px;

    font-size:16px;

}

button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:10px;

    background:#2563eb;

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    background:#1d4ed8;

}

.footer{

    margin-top:25px;

    color:#d1d5db;

    font-size:14px;

}

</style>

</head>

<body>

<div class="login-box">

<h1>AI Attendance</h1>

<p>Admin Login</p>

<form method="POST">

<div class="input-box">
<input
type="text"
name="username"
placeholder="Username"
required>
</div>

<div class="input-box">
<input
type="password"
name="password"
placeholder="Password"
required>
</div>

<button type="submit">
Login
</button>

</form>

<div class="footer">
AI Face Recognition Attendance System
</div>

</div>

</body>

</html>
