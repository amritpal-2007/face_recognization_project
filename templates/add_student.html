<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Student</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{

    background:#f4f7fc;

}

.header{

    background:#2563eb;

    color:white;

    padding:20px;

    text-align:center;

    box-shadow:0 2px 10px rgba(0,0,0,.2);

}

.container{

    width:450px;

    margin:50px auto;

    background:white;

    padding:35px;

    border-radius:15px;

    box-shadow:0 10px 25px rgba(0,0,0,.15);

}

.container h2{

    text-align:center;

    margin-bottom:25px;

    color:#222;

}

label{

    font-weight:bold;

    color:#444;

}

input{

    width:100%;

    padding:12px;

    margin-top:8px;

    margin-bottom:20px;

    border:1px solid #ccc;

    border-radius:8px;

    font-size:16px;

}

input:focus{

    outline:none;

    border:1px solid #2563eb;

}

button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:8px;

    background:#2563eb;

    color:white;

    font-size:17px;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    background:#1d4ed8;

}

.back{

    display:block;

    text-align:center;

    margin-top:20px;

    text-decoration:none;

    color:#2563eb;

    font-weight:bold;

}

.back:hover{

    text-decoration:underline;

}

</style>

</head>

<body>

<div class="header">

<h1>AI Face Recognition Attendance System</h1>

</div>

<div class="container">

<h2>Add New Student</h2>

<form method="POST">

<label>Student Name</label>

<input
type="text"
name="name"
placeholder="Enter Student Name"
required>

<label>Roll Number</label>

<input
type="text"
name="roll"
placeholder="Enter Roll Number"
required>

<label>Department</label>

<input
type="text"
name="department"
placeholder="Enter Department"
required>

<button type="submit">

Add Student

</button>

</form>

<a class="back" href="/dashboard">

← Back to Dashboard

</a>

</div>

</body>

</html>
